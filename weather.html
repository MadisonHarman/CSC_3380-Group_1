<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TripIt • Weather</title>
    <link rel="stylesheet" href="/css/styler.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <script src="/js/weather.js" defer></script>
    <script defer src="js/storage.js"></script>
    <script defer src="js/common.js"></script>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
</head>
<body>
    <header class="topbar">  <!-- The top bar contains all of the available tabs thus far. -->
    <h1>TripIt</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="calendar.html">Calendar</a>
      <a href="calendar_view.html">Calendar View</a>
      <a href="weather.html">Weather</a>
      <a href="packing.html">Packing List</a>
    </nav>
  </header>


    <main class="main-container">
        
        <header class="input-container">
            <input class="city-input" type="text" placeholder="Enter City">
            <button class="search-btn">
                <span class="material-symbols-outlined">
                    search
                </span>
            </button>
        </header>
        <section class="weather-info" style="display: none">
            <div class="location-date-container">
                <div class="location">
                    <span class="material-symbols-outlined">
                        location_on
                    </span>
                    <h4 class="country-txt"></h4>
                </div>
                <h5 class="current-date-txt regular-txt"></h5>
            </div>

            <div class="weather-summary-container">
                <img src="svg/cloudy.svg"  class="weather-summary-img">
                <div class="weather-summary-info">
                    <h1 class="temp-txt"></h1>
                    <h3 class="condition-txt regular-txt"></h3>
                    <h5 class="feels-txt regular-txt">Feels Like: 44°F</h5>
                </div>
            </div>

            <div class="weather-conditions-container">
                <div class="condition-item">
                    <span class="material-symbols-outlined">
                        water_drop
                    </span>
                    <div class="conditon-info">
                        <h5 class="regular-txt">Humidity</h5>
                        <h5 class="humidity-value-txt"></h5>
                    </div>
                </div>

                 <div class="condition-item">
                    <span class="material-symbols-outlined">
                        air
                    </span>
                    <div class="conditon-info">
                        <h5 class="regular-txt">Wind Speed</h5>
                        <h5 class="wind-value-txt"></h5>
                    </div>
                </div>
            </div>

            <div class="forecast-items-container"></div>
        </section>

        <section class="search-city section-message">
            <img src="svg/searching3.svg">
            <div>
                <h1>Search City</h1>
                <h4 class="regular-txt">
                    Enter a valid city name to get started!
                </h4>
            </div>
        </section>

        <section class="not-found section-message" style="display: none">
            <img src="svg/error404.svg">
            <div>
                <h1>Search City</h1>
                <h4 class="regular-txt">
                    Uh Oh! Looks like you need to enter a valid city.
                </h4>
            </div>
        </section>



    </main>
  
<footer class="footer">
    <p>Powered by OpenWeatherMap.org API. </p>  <!-- A quick acknowledgement in the bottom of the page. -->
  </footer>
</body>
</html>
